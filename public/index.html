<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>나의 가계부</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- 로그인 화면 -->
  <main id="login-view" class="login hidden">
    <form id="login-form" class="card login-card">
      <h1>나의 가계부</h1>
      <p class="muted">비밀번호를 입력해 주세요.</p>
      <input id="password" type="password" placeholder="비밀번호" autocomplete="current-password" required />
      <button type="submit" class="btn primary">로그인</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </main>

  <!-- 메인 화면 -->
  <div id="app-view" class="hidden">
    <header class="topbar">
      <h1>나의 가계부</h1>
      <button id="logout-btn" class="btn ghost">로그아웃</button>
    </header>

    <main class="container">
      <!-- 입력/수정 -->
      <section class="card">
        <h2 id="form-title">지출 추가</h2>
        <form id="expense-form" class="expense-form">
          <label>날짜
            <input id="f-date" type="date" required />
          </label>
          <label>항목
            <input id="f-item" type="text" maxlength="100" placeholder="예: 점심 식사" required />
          </label>
          <label>카테고리
            <select id="f-category" required></select>
          </label>
          <label>금액(원)
            <input id="f-amount" type="number" min="0" step="1" inputmode="numeric" placeholder="0" required />
          </label>
          <div class="form-actions">
            <button type="submit" id="submit-btn" class="btn primary">추가</button>
            <button type="button" id="cancel-edit" class="btn ghost hidden">취소</button>
          </div>
        </form>
        <p id="form-error" class="error" role="alert"></p>
      </section>

      <!-- 검색 + 목록 -->
      <section class="card">
        <h2>지출 내역</h2>
        <form id="search-form" class="search-form">
          <label>시작일 <input id="s-from" type="date" /></label>
          <label>종료일 <input id="s-to" type="date" /></label>
          <button type="submit" class="btn primary">검색</button>
          <button type="button" id="s-today" class="btn ghost">오늘</button>
          <button type="button" id="s-reset" class="btn ghost">전체</button>
        </form>
        <p class="muted small">한 날짜만 검색하려면 시작일과 종료일을 같게 입력하거나 시작일만 입력하세요.</p>
        <div class="list-summary" id="list-summary"></div>
        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr><th>날짜</th><th>항목</th><th>카테고리</th><th class="num">금액</th><th></th></tr>
            </thead>
            <tbody id="expense-rows"></tbody>
          </table>
        </div>
        <p id="list-empty" class="muted center hidden">내역이 없습니다.</p>
      </section>

      <div class="grid-2">
        <!-- 월별 합계 -->
        <section class="card">
          <div class="card-head">
            <h2>월별 지출 합계</h2>
            <select id="year-select"></select>
          </div>
          <p class="big" id="year-total"></p>
          <table class="table compact">
            <thead><tr><th>월</th><th class="num">건수</th><th class="num">합계</th></tr></thead>
            <tbody id="monthly-rows"></tbody>
          </table>
        </section>

        <!-- 카테고리별 합계 -->
        <section class="card">
          <div class="card-head">
            <h2>카테고리별 지출</h2>
            <input id="cat-month" type="month" />
          </div>
          <p class="big" id="cat-total"></p>
          <div id="cat-chart" class="bar-chart"></div>
          <p id="cat-empty" class="muted center hidden">해당 월의 지출이 없습니다.</p>
        </section>
      </div>
    </main>
  </div>

  <div id="toast" class="toast hidden" role="status"></div>
  <script src="/app.js"></script>
</body>
</html>
